<!DOCTYPE html>
<html>
    <head>
        <title>Scrolling Text</title>
    </head>
    <body>

        <h2 align="center">HTML Marquee Tag - Demonstration</h2>

        <marquee behaviour="scroll" direction="left"
        scrollamount="5" bgcolor="yellow">
         welcome to web technology lab - 24UIT506
    </marquee>    
    <br>
        <marquee behaviour="alternate" direction="right"
        scrollamount="8" bgcolor="lightgreen">
          this text bounces back and forth
    </marquee>
    <br>    

    <marquee direction="up" 
    height="250"
    bgcolor="lightblue">
    <img src="https://img.magnific.com/free-photo/anime-style-cozy-home-interior-with-furnishings_23-2151176468.jpg?w=360"
         width="200"
         height="200"
         border="3">
    </marquee>
    <br>
    <marquee
    behavior="scroll"
    direction="left"
    scrollamount="10"
    onmouseover="this.stop();"
    onmouseout="this.start();"
    bgcolor="pink">

    <img src="https://img.magnific.com/free-photo/anime-style-cozy-home-interior-with-furnishings_23-2151176468.jpg?w=360"
         width="250"
         height="170"
         border="3"
         alt="Image">

</marquee>

    </body>

    </html>
